<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#192347"/>
      <stop offset="52%" stop-color="#111834"/>
      <stop offset="100%" stop-color="#090d1e"/>
    </linearGradient>
    <radialGradient id="aura1" cx="22%" cy="20%" r="72%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".48"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura2" cx="82%" cy="84%" r="68%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="100" y1="90" x2="412" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="prism" x1="176" y1="168" x2="336" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="outerRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".22"/>
    </linearGradient>
    <filter id="haloGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#aura1)"/>
  <rect width="512" height="512" rx="118" fill="url(#aura2)"/>
  <rect x="3" y="3" width="506" height="506" rx="115" fill="none" stroke="url(#outerRim)" stroke-width="5"/>
  <!-- Luminous Halo Ring -->
  <circle cx="256" cy="256" r="144" fill="none" stroke="url(#ring)" stroke-width="46" filter="url(#haloGlow)"/>
  <path d="M148 164 A144 144 0 0 1 364 164" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".52"/>
  <!-- Inner frosted glass lens disc -->
  <circle cx="256" cy="256" r="94" fill="#131c3d" fill-opacity=".62" stroke="#ffffff" stroke-opacity=".22" stroke-width="3"/>
  <!-- Center 4-point Prism Star (crisp even at 16px) -->
  <g filter="url(#softShadow)">
    <path d="M256 154 C264 218 294 248 358 256 C294 264 264 294 256 358 C248 294 218 264 154 256 C218 248 248 218 256 154 Z" fill="url(#prism)"/>
    <path d="M256 154 C264 218 294 248 358 256 L256 256 Z" fill="#ffffff" opacity=".45"/>
  </g>
</svg>
