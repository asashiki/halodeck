<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>HaloDeck 恢复</title><style>body{font:20px/1.8 system-ui;max-width:800px;margin:8vh auto;padding:24px;background:#102035;color:#e6f6ff}a{color:#71dcff}</style><h1>备份与恢复</h1><p>源码仓库保存安装配方；加密备份保存你自己的数据；独立恢复包保存解密钥匙。</p><p>先按仓库 docs/BACKUP.md 连接自己的云盘，完成第一次备份和恢复测试，再启用定时任务。</p><p>换机器时，把私有恢复包解压到新机，然后运行 <code>python3 recover.py --target /srv/halodeck-restored</code>。目标必须为空；脚本不会自动启动服务。</p><p><a href="/">返回面板</a></p></html>
